<!doctype html>
<!--
  THROWAWAY PROTOTYPE — ProofBook row states. Issue #41, map #37.

  Three variants of the palette's rows and coverage bar, switchable via
  ?variant=A|B|C and the floating bar, crossed with ?scenario= so each is judged
  in bulk as well as sprinkled. Rendered inside a mock Glyphs 4 sidebar at its
  real 200px width, with the real metrics from plugin.py: 18pt rows, 9pt swatch,
  13pt margin, 4pt coverage bar, 9pt semibold pill.

  The question: once status comes out of the filename (#43), a row can exist
  before its status does. THREE new conditions have to be told apart from each
  other and from `todo` — because `todo` is an answer and these are the absence
  of one:

    placeholder   the provider has not downloaded the file. After #39's cache
                  this is a FIRST-RUN condition, not the steady state.
    walking       the listing walk has not reached this page. Transient, and
                  per #40 it is the whole tree at once on a cold first open.
    malformed     #43 made such a page untaggable, not merely un-notable, so
                  its inertness wants showing rather than only being reported
                  when the swatch is clicked.

  And: what the coverage bar says when it knows 6 of 24.

  Not code to keep. The winner gets rewritten properly in plugin.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProofBook row states — prototype</title>
<style>
  :root {
    --sidebar-bg: #ececec;
    --panel-bg: #f6f6f6;
    --line: #d3d3d3;
    --text: #1d1d1f;
    --dim: #8a8a8e;
    --sel: #3478f6;
    --todo: #b0b0b5;
    --wip: #e8a33d;
    --done: #43a047;
    --warn: #c8472f;
    /* plugin.py constants */
    --margin: 13px;
    --row: 18px;
    --swatch: 9px;
    --bar: 4px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font: 13px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text); background: #dcdcdc;
    display: flex; flex-direction: column;
  }
  .titlebar {
    height: 38px; background: linear-gradient(#f4f4f4, #e4e4e4);
    border-bottom: 1px solid #c0c0c0; display: flex; align-items: center;
    padding: 0 12px; gap: 8px; flex: none;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .doc-title { margin-left: 8px; font-weight: 600; }
  .body { flex: 1; display: flex; min-height: 0; }
  .canvas {
    flex: 1; background: #fff; display: grid; place-items: center;
    color: #c8c8cc; font-size: 64px; letter-spacing: 2px;
  }
  .sidebar {
    width: 240px; flex: none; background: var(--sidebar-bg);
    border-left: 1px solid #c0c0c0; overflow-y: auto; padding-bottom: 60px;
  }
  .palette { background: var(--panel-bg); border-bottom: 1px solid var(--line); }
  .palette-header {
    height: 24px; display: flex; align-items: center; gap: 5px;
    padding-left: var(--margin); font-size: 11px; font-weight: 600;
    color: #4a4a4e; border-bottom: 1px solid var(--line);
  }
  .chev { font-size: 8px; color: var(--dim); }
  .other { color: var(--dim); font-weight: 500; }

  /* ---- coverage ---- */
  .coverage { padding: 7px var(--margin) 0; }
  .track {
    height: var(--bar); border-radius: 2px; background: #dcdcdf;
    overflow: hidden; display: flex;
  }
  .track .seg { height: 100%; }
  .seg.done { background: var(--done); }
  .seg.wip { background: var(--wip); }
  .seg.unknown {
    background: repeating-linear-gradient(
      -45deg, #c6c6ca 0 2px, transparent 2px 4px
    );
  }
  .caption {
    font-size: 11px; color: var(--dim); padding: 2px 0 6px;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .caption .warnish { color: var(--warn); }

  /* ---- rows ---- */
  .rows { padding-bottom: 4px; }
  .row {
    height: var(--row); display: flex; align-items: center;
    padding-right: 11px; position: relative; cursor: default;
  }
  .row.sel { background: var(--sel); color: #fff; }
  .marker { width: 17px; flex: none; display: grid; place-items: center; }
  .sw {
    width: var(--swatch); height: var(--swatch); border-radius: 50%;
  }
  .sw.todo { border: 1.5px solid var(--todo); }
  .sw.wip { background: var(--wip); }
  .sw.done { background: var(--done); }
  .sw.dashed { border: 1.5px dashed #a8a8ad; }
  .sw.faint { border: 1.5px solid #dadade; }
  .sw.pulse { border: 1.5px solid #cfcfd4; animation: pulse 1.1s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .sw.bad { border: 1.5px solid var(--warn); position: relative; }
  .sw.bad::after {
    content: ""; position: absolute; inset: -1px;
    background: linear-gradient(45deg, transparent 44%, var(--warn) 44% 56%, transparent 56%);
  }
  .glyph { font-size: 9px; color: var(--dim); line-height: 1; }
  .glyph.warn { color: var(--warn); }
  .subject { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subject.dim { color: var(--dim); }
  .row.sel .subject.dim { color: rgba(255,255,255,.7); }
  .subject.italic { font-style: italic; color: #a0a0a5; }
  .folder { font-weight: 600; }
  .pill {
    font-size: 9px; font-weight: 600; padding: 0 4px; height: 13px;
    line-height: 13px; border-radius: 6.5px; background: rgba(0,0,0,.09);
    color: #57575c; flex: none; letter-spacing: .3px;
  }
  .row.sel .pill { background: rgba(255,255,255,.28); color: #fff; }
  .badge {
    font-size: 9px; font-weight: 600; padding: 0 4px; height: 13px;
    line-height: 13px; border-radius: 3px; flex: none;
    background: rgba(200,71,47,.14); color: var(--warn);
  }
  .cloud { font-size: 10px; color: #a8a8ad; flex: none; }

  /* ---- chrome-level notices (variant C) ---- */
  .notice {
    font-size: 11px; color: var(--dim); padding: 3px var(--margin) 5px;
    display: flex; align-items: center; gap: 5px;
  }
  .notice a { color: var(--sel); text-decoration: none; }
  .notice.warn { color: var(--warn); }
  .whole-tree {
    padding: 14px var(--margin); font-size: 11px; color: var(--dim);
  }
  .footer {
    height: 26px; border-top: 1px solid var(--line); display: flex;
    align-items: center; padding-left: var(--margin); font-size: 11px;
    color: var(--sel);
  }

  /* ---- switcher ---- */
  .switcher {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: #1d1d1f; color: #fff; border-radius: 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35); display: flex; align-items: center;
    gap: 2px; padding: 5px 6px; font-size: 12px; z-index: 50;
  }
  .switcher button {
    background: transparent; border: 0; color: #fff; font: inherit;
    padding: 4px 9px; border-radius: 14px; cursor: pointer;
  }
  .switcher button:hover { background: rgba(255,255,255,.14); }
  .switcher button.on { background: #fff; color: #1d1d1f; font-weight: 600; }
  .switcher .label { padding: 0 10px; opacity: .65; white-space: nowrap; }
  .switcher .sep { width: 1px; height: 18px; background: rgba(255,255,255,.2); margin: 0 4px; }
  .legend {
    position: fixed; bottom: 14px; left: 14px; max-width: 300px;
    background: rgba(29,29,31,.92); color: #fff; border-radius: 8px;
    padding: 9px 11px; font-size: 11px; line-height: 1.45; z-index: 50;
  }
  .legend b { color: #ffd479; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <div class="doc-title">Pickala.glyphs</div>
</div>

<div class="body">
  <div class="canvas">Hamburgefonstiv</div>
  <div class="sidebar">
    <div class="palette">
      <div class="palette-header"><span class="chev">▾</span> ProofBook</div>
      <div id="palette"></div>
    </div>
    <div class="palette">
      <div class="palette-header other"><span class="chev">▸</span> Transformations</div>
    </div>
    <div class="palette">
      <div class="palette-header other"><span class="chev">▸</span> Layers</div>
    </div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="switcher" id="switcher"></div>

<script>
// ---------------------------------------------------------------- the listing
// depth, subject, status, owner, condition. `condition` is what this prototype
// exists for: known | placeholder | walking | malformed
const BOOK = [
  [0, "caps",            "folder"],
  [1, "caps ink",        "done",  "NE",  "known"],
  [1, "caps spacing",    "wip",   "NE",  "known"],
  [1, "caps pairs",      "todo",  null,  "known"],
  [1, "caps diagonals",  null,    null,  "placeholder"],
  [0, "lowercase",       "folder"],
  [1, "handgloves",      "done",  "MP",  "known"],
  [1, "adhesion",        "done",  null,  "known"],
  [1, "n o n o",         "wip",   "MP",  "known"],
  [1, "overshoots",      null,    null,  "malformed"],
  [1, "round pairs",     null,    null,  "placeholder"],
  [0, "figures",         "folder"],
  [1, "tabular",         "todo",  null,  "known"],
  [1, "fractions",       null,    null,  "placeholder"],
  [0, "punctuation",     "todo",  null,  "known"],
  [0, "words common",    "wip",   "NE",  "known"],
];

const SCENARIOS = {
  steady:  { name: "steady state",   map: r => r },
  cold:    { name: "cold first open", map: r => r[2] === "folder" ? r : [r[0], r[1], null, null, "walking"] },
  offline: { name: "book never opened", map: r => r[2] === "folder" ? r : [r[0], r[1], null, null, "placeholder"] },
};

function rows(scenario) {
  return BOOK.map(SCENARIOS[scenario].map);
}

function tally(list) {
  const t = { done: 0, wip: 0, todo: 0, placeholder: 0, walking: 0, malformed: 0, pages: 0 };
  for (const r of list) {
    if (r[2] === "folder") continue;
    t.pages++;
    if (r[4] === "known") t[r[2]]++;
    else t[r[4]]++;
  }
  t.known = t.done + t.wip + t.todo;
  return t;
}

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function shell(inner) {
  const wrap = document.createElement("div");
  inner.forEach(n => n && wrap.appendChild(n));
  const footer = el("div", "footer", "+ New proof-page");
  wrap.appendChild(footer);
  return wrap;
}

function bar(segments) {
  const track = el("div", "track");
  segments.forEach(([cls, pct]) => {
    if (pct <= 0) return;
    const seg = el("div", "seg " + cls);
    seg.style.width = pct + "%";
    track.appendChild(seg);
  });
  return track;
}

function baseRow(r, opts = {}) {
  const row = el("div", "row" + (opts.sel ? " sel" : ""));
  const marker = el("div", "marker");
  marker.style.marginLeft = (13 + r[0] * 13) + "px";
  row.appendChild(marker);
  const subject = el("div", "subject" + (opts.subjectClass ? " " + opts.subjectClass : ""), r[1]);
  row.appendChild(subject);
  return { row, marker, subject };
}

// ------------------------------------------------------------------ variant A
// "The swatch says everything." Every condition is a marker appearance; the row
// anatomy never changes. Coverage hatches the unknown share.
function variantA(scenario) {
  const list = rows(scenario), t = tally(list);
  const cov = el("div", "coverage");
  cov.appendChild(bar([
    ["done", t.done / t.pages * 100],
    ["wip", t.wip / t.pages * 100],
    ["unknown", (t.placeholder + t.walking + t.malformed) / t.pages * 100],
  ]));
  const cap = el("div", "caption");
  cap.appendChild(el("span", null, `${t.done} of ${t.pages} done`));
  const rest = t.pages - t.known;
  if (rest) cap.appendChild(el("span", null, `${rest} unknown`));
  cov.appendChild(cap);

  const body = el("div", "rows");
  list.forEach((r, i) => {
    if (r[2] === "folder") {
      const { row, marker, subject } = baseRow(r);
      marker.appendChild(el("div", "glyph", "▸"));
      subject.className = "subject folder";
      body.appendChild(row);
      return;
    }
    const { row, marker } = baseRow(r, { sel: i === 2 });
    const sw = el("div", "sw");
    if (r[4] === "known") sw.className = "sw " + r[2];
    else if (r[4] === "placeholder") sw.className = "sw dashed";
    else if (r[4] === "walking") sw.className = "sw pulse";
    else if (r[4] === "malformed") sw.className = "sw bad";
    marker.appendChild(sw);
    if (r[3]) row.appendChild(el("div", "pill", r[3]));
    body.appendChild(row);
  });
  return shell([cov, body]);
}

// ------------------------------------------------------------------ variant B
// "The swatch is only ever a status." The three new conditions live in the row's
// typography and the pill slot instead. Coverage measures only what it knows.
function variantB(scenario) {
  const list = rows(scenario), t = tally(list);
  const cov = el("div", "coverage");
  const denom = t.known || 1;
  cov.appendChild(bar([
    ["done", t.done / denom * 100],
    ["wip", t.wip / denom * 100],
  ]));
  const cap = el("div", "caption");
  cap.appendChild(el("span", null,
    t.known === t.pages
      ? `${t.done} of ${t.pages} done`
      : `${t.done} of ${t.known} done · ${t.pages - t.known} not read`));
  cov.appendChild(cap);

  const body = el("div", "rows");
  list.forEach((r, i) => {
    if (r[2] === "folder") {
      const { row, marker, subject } = baseRow(r);
      marker.appendChild(el("div", "glyph", "▸"));
      subject.className = "subject folder";
      body.appendChild(row);
      return;
    }
    const cls = r[4] === "walking" ? "italic" : r[4] === "known" ? null : "dim";
    const { row, marker } = baseRow(r, { sel: i === 2, subjectClass: cls });
    const sw = el("div", "sw");
    if (r[4] === "known") sw.className = "sw " + r[2];
    else sw.className = "sw faint";
    marker.appendChild(sw);
    if (r[4] === "placeholder") row.appendChild(el("div", "cloud", "↓"));
    else if (r[4] === "malformed") row.appendChild(el("div", "badge", "HEADER"));
    else if (r[3]) row.appendChild(el("div", "pill", r[3]));
    body.appendChild(row);
  });
  return shell([cov, body]);
}

// ------------------------------------------------------------------ variant C
// "State is chrome, not a row." Rows show only what is known — a placeholder has
// NO swatch, an absence rather than a symbol — and the counts move up into the
// notice line that ADR-0004 already specifies. A cold open replaces the tree
// entirely, which #40 says is the honest shape: the whole tree is in that state.
function variantC(scenario) {
  const list = rows(scenario), t = tally(list);
  const parts = [];

  const cov = el("div", "coverage");
  cov.appendChild(bar([
    ["done", t.done / t.pages * 100],
    ["wip", t.wip / t.pages * 100],
  ]));
  const cap = el("div", "caption");
  cap.appendChild(el("span", null, `${t.done} of ${t.pages} done`));
  cov.appendChild(cap);
  parts.push(cov);

  if (t.walking === t.pages) {
    parts.push(el("div", "whole-tree", "Reading the proof-book…"));
    return shell(parts);
  }

  if (t.placeholder) {
    const n = el("div", "notice");
    n.appendChild(el("span", null, `${t.placeholder} of ${t.pages} pages not downloaded`));
    const a = el("a", null, "Download");
    a.href = "#";
    n.appendChild(a);
    parts.push(n);
  }
  if (t.malformed) {
    const n = el("div", "notice warn");
    n.appendChild(el("span", null,
      `${t.malformed} page${t.malformed > 1 ? "s" : ""} with an unreadable header`));
    parts.push(n);
  }

  const body = el("div", "rows");
  list.forEach((r, i) => {
    if (r[2] === "folder") {
      const { row, marker, subject } = baseRow(r);
      marker.appendChild(el("div", "glyph", "▸"));
      subject.className = "subject folder";
      body.appendChild(row);
      return;
    }
    const { row, marker, subject } = baseRow(r, {
      sel: i === 2,
      subjectClass: r[4] === "known" ? null : "dim",
    });
    if (r[4] === "known") {
      const sw = el("div", "sw " + r[2]);
      marker.appendChild(sw);
    } else if (r[4] === "malformed") {
      marker.appendChild(el("div", "glyph warn", "!"));
    }
    // placeholder and walking: the marker column stays empty on purpose.
    if (r[3]) row.appendChild(el("div", "pill", r[3]));
    body.appendChild(row);
  });
  parts.push(body);
  return shell(parts);
}

const VARIANTS = {
  A: ["Swatch says everything", variantA],
  B: ["Swatch is only a status", variantB],
  C: ["State is chrome, not a row", variantC],
};

const NOTES = {
  A: "Every condition is a marker appearance: <b>dashed</b> = placeholder, <b>pulsing</b> = walking, <b>crossed</b> = malformed. Row anatomy never changes, and the coverage bar hatches the unknown share so the denominator stays honest at 24. Risk: four outline-ish circles to tell apart at 9pt.",
  B: "The swatch is <b>only ever a status</b>. Everything else is the row: dimmed subject for a placeholder with a download arrow in the pill slot, italic for walking, a <b>HEADER</b> badge for malformed. Coverage measures only what it has read — the denominator moves, which is either honest or unsettling.",
  C: "Rows carry <b>only what is known</b>; a placeholder has no swatch at all — an absence, not a symbol. Counts move into the notice line ADR-0004 already specifies, and a cold open replaces the tree with one line instead of 16 pulsing ones. Only malformed keeps a per-row mark, being the one that is permanent and per-page.",
};

function render() {
  const p = new URLSearchParams(location.search);
  const v = VARIANTS[p.get("variant")] ? p.get("variant") : "A";
  const s = SCENARIOS[p.get("scenario")] ? p.get("scenario") : "steady";
  const host = document.getElementById("palette");
  host.innerHTML = "";
  host.appendChild(VARIANTS[v][1](s));

  const t = tally(rows(s));
  document.getElementById("legend").innerHTML =
    `<b>${v} — ${VARIANTS[v][0]}</b><br>${NOTES[v]}<br><br>` +
    `<b>${SCENARIOS[s].name}</b>: ${t.pages} pages — ${t.known} known, ` +
    `${t.placeholder} placeholder, ${t.walking} walking, ${t.malformed} malformed`;

  const sw = document.getElementById("switcher");
  sw.innerHTML = "";
  Object.keys(VARIANTS).forEach(key => {
    const b = el("button", key === v ? "on" : null, key);
    b.onclick = () => go({ variant: key, scenario: s });
    sw.appendChild(b);
  });
  sw.appendChild(el("div", "sep"));
  Object.entries(SCENARIOS).forEach(([key, def]) => {
    const b = el("button", key === s ? "on" : null, def.name);
    b.onclick = () => go({ variant: v, scenario: key });
    sw.appendChild(b);
  });
  sw.appendChild(el("div", "label", "← → variants"));
}

function go(state) {
  const p = new URLSearchParams(state);
  history.replaceState(null, "", "?" + p.toString());
  render();
}

addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const keys = Object.keys(VARIANTS);
  const p = new URLSearchParams(location.search);
  const v = VARIANTS[p.get("variant")] ? p.get("variant") : "A";
  const i = keys.indexOf(v);
  const next = keys[(i + (e.key === "ArrowRight" ? 1 : keys.length - 1)) % keys.length];
  go({ variant: next, scenario: SCENARIOS[p.get("scenario")] ? p.get("scenario") : "steady" });
});

render();
</script>
</body>
</html>
